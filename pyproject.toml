[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "til-discord-bot"
version = "0.1.0"
description = "Discord bot for managing TIL posts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "discord.py>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

