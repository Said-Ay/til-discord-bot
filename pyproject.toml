[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "til-discord-bot"
version = "0.1.0"
description = "Discord bot for managing TIL posts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyGithub",
    "python-dotenv",
    "discord.py",
]
[tool.setuptools.packages.find]
where = ["src"]

